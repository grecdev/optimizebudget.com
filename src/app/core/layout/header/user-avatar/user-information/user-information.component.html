<ng-container *ngIf="getUserRequest$ | async as getUserRequest; else loading">
  <ng-container *ngIf="getUserRequest.data.user as userData">
    <p *ngIf="userData.user_metadata['display_name']">
      <strong>{{ userData.user_metadata['display_name'] }}</strong>
    </p>

    <p>{{ userData.email }}</p>
  </ng-container>

  <ng-container *ngIf="getUserRequest.error as error">
    <p appInfoText type="error">{{ error.name }} {{ error.status }}: {{ error.message }}</p>
  </ng-container>
</ng-container>

<ng-template #loading>
  <app-loader />
</ng-template>
