<div class="container">
  <ng-container *ngIf="userData; else loading">
    <p>
      <strong>{{ fullName }}</strong>
    </p>

    <p>{{ email }}</p>
  </ng-container>
</div>

<ng-template #loading>
  <app-loader />
</ng-template>

<ng-container *ngIf="error">
  <p appInfoText type="error">User not found!</p>
</ng-container>
