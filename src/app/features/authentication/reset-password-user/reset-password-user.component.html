<app-authentication-logo-container />

<div class="form-container">
  <div class="header">
    <h4 class="mb-sm">Reset User Password</h4>
  </div>

  <form
    id="resetPasswordForm"
    class="text-align-left"
    #ngFormLogin="ngForm"
    (ngSubmit)="handleForgotPassword(ngFormLogin)"
  >
    <app-form-field
      variant="outlined"
      color="primary-default"
      class="mb-default"
      fullWidth
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>New Password</app-input-label>

      <input
        appInput
        id="password"
        type="password"
        placeholder="******"
        [(ngModel)]="resetPasswordForm[InputTypes.PASSWORD]"
        [name]="InputTypes.PASSWORD"
        required
      />
    </app-form-field>

    <app-form-field
      variant="outlined"
      color="primary-default"
      class="mb-default"
      fullWidth
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>Confirm New Password</app-input-label>

      <input
        appInput
        id="confirm-password"
        type="password"
        placeholder="******"
        [(ngModel)]="resetPasswordForm[InputTypes.CONFIRM_PASSWORD]"
        [name]="InputTypes.CONFIRM_PASSWORD"
        required
      />
    </app-form-field>

    <button
      type="submit"
      id="reset-password-button"
      appButton
      variant="contained"
      color="primary"
      [disabled]="ngFormLogin.invalid"
      [loading]="resetPasswordLoading"
    >
      Reset password
    </button>
  </form>
</div>
