<app-authentication-logo-container />

<ng-container *ngIf="!registerSuccess; else successRegisterView">
  <app-register-form class="form-container" (registerSuccessEmitter)="setRegisterSuccess($event)" />
</ng-container>

<ng-template #successRegisterView>
  <app-success-register class="form-container" />
</ng-template>

<app-agree-info-component textContent="register" />
