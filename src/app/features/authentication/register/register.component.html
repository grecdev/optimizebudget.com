<app-authentication-logo-container />

<div class="form-container">
  <div class="header">
    <h4 class="mb-sm">Create an account</h4>

    <p class="light-text">Let's get started. Fill in the details below to create your account.</p>
  </div>

  <form
    id="registerForm"
    class="text-align-left"
    [formGroup]="registerForm"
    (ngSubmit)="handleSubmit()"
  >
    <app-form-field
      variant="outlined"
      color="primary-default"
      class="mb-default"
      fullWidth
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>Full Name</app-input-label>

      <input
        appInput
        id="full-name"
        type="text"
        placeholder="John Doe"
        [formControlName]="InputTypes.FULL_NAME"
      />
    </app-form-field>

    <app-form-field
      variant="outlined"
      color="primary-default"
      class="mb-default"
      fullWidth
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>Email</app-input-label>

      <input
        appInput
        id="email"
        type="email"
        placeholder="mail@example.com"
        [formControlName]="InputTypes.EMAIL"
      />
    </app-form-field>

    <div class="password-container mb-default">
      <app-form-field
        variant="outlined"
        color="primary-default"
        fullWidth
        [labelOptions]="{
          position: 'top',
        }"
      >
        <app-input-label class="password-label">Password</app-input-label>

        <input
          appInput
          id="password"
          type="password"
          placeholder="******"
          [formControlName]="InputTypes.PASSWORD"
        />
      </app-form-field>

      <div class="password-requirements">
        <p
          class="requirement-box"
          [attr.data-type]="
            ({
              value: registerForm.value[InputTypes.PASSWORD],
              regularExpression: regexPatterns.lengthLimit,
            } | passwordRequirementType)
              ? RequirementType.VALID
              : RequirementType.INVALID
          "
        >
          <app-icon
            [svgIcon]="icons['check']"
            *ngIf="
              {
                value: registerForm.value[InputTypes.PASSWORD],
                regularExpression: regexPatterns.lengthLimit,
              } | passwordRequirementType;
              else invalidIcon
            "
          />

          <ng-template #invalidIcon>
            <app-icon [svgIcon]="icons['xMark']" />
          </ng-template>

          <span>5-15 characters</span>
        </p>

        <p
          class="requirement-box"
          [attr.data-type]="
            ({
              value: registerForm.value[InputTypes.PASSWORD],
              regularExpression: regexPatterns.uppercase,
            } | passwordRequirementType)
              ? RequirementType.VALID
              : RequirementType.INVALID
          "
        >
          <app-icon
            [svgIcon]="icons['check']"
            *ngIf="
              {
                value: registerForm.value[InputTypes.PASSWORD],
                regularExpression: regexPatterns.uppercase,
              } | passwordRequirementType;
              else invalidIcon
            "
          />

          <ng-template #invalidIcon>
            <app-icon [svgIcon]="icons['xMark']" />
          </ng-template>

          <span>Uppercase letters</span>
        </p>

        <p
          class="requirement-box"
          [attr.data-type]="
            ({
              value: registerForm.value[InputTypes.PASSWORD],
              regularExpression: regexPatterns.specialCharacters,
            } | passwordRequirementType)
              ? RequirementType.VALID
              : RequirementType.INVALID
          "
        >
          <app-icon
            [svgIcon]="icons['check']"
            *ngIf="
              {
                value: registerForm.value[InputTypes.PASSWORD],
                regularExpression: regexPatterns.specialCharacters,
              } | passwordRequirementType;
              else invalidIcon
            "
          />

          <ng-template #invalidIcon>
            <app-icon [svgIcon]="icons['xMark']" />
          </ng-template>

          <span>Special characters $%&_@!</span>
        </p>

        <p
          class="requirement-box"
          [attr.data-type]="
            ({
              value: registerForm.value[InputTypes.PASSWORD],
              regularExpression: regexPatterns.lowercase,
            } | passwordRequirementType)
              ? RequirementType.VALID
              : RequirementType.INVALID
          "
        >
          <app-icon
            [svgIcon]="icons['check']"
            *ngIf="
              {
                value: registerForm.value[InputTypes.PASSWORD],
                regularExpression: regexPatterns.lowercase,
              } | passwordRequirementType;
              else invalidIcon
            "
          />

          <ng-template #invalidIcon>
            <app-icon [svgIcon]="icons['xMark']" />
          </ng-template>

          <span>Lowercase letters</span>
        </p>

        <p
          class="requirement-box"
          [attr.data-type]="
            ({
              value: registerForm.value[InputTypes.PASSWORD],
              regularExpression: regexPatterns.numbers,
            } | passwordRequirementType)
              ? RequirementType.VALID
              : RequirementType.INVALID
          "
        >
          <app-icon
            [svgIcon]="icons['check']"
            *ngIf="
              {
                value: registerForm.value[InputTypes.PASSWORD],
                regularExpression: regexPatterns.numbers,
              } | passwordRequirementType;
              else invalidIcon
            "
          />

          <ng-template #invalidIcon>
            <app-icon [svgIcon]="icons['xMark']" />
          </ng-template>

          <span>Numbers</span>
        </p>
      </div>
    </div>

    <app-form-field
      class="mb-default"
      variant="outlined"
      color="primary-default"
      fullWidth
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>Confirm Password</app-input-label>

      <input
        appInput
        id="confirm-password"
        type="password"
        placeholder="******"
        [formControlName]="InputTypes.CONFIRM_PASSWORD"
      />
    </app-form-field>

    <button
      type="submit"
      appButton
      variant="contained"
      color="primary"
      [disabled]="registerForm.invalid"
    >
      Register
    </button>
  </form>

  <app-form-delimiter textContent="Or sign in with" />

  <div class="buttons-socials">{{ "{{ WIP }}" }}</div>

  <p>
    Already have an account?
    <a routerLink="/{{ paths.login.path }}" class="redirect-link underline">Login</a>
  </p>
</div>

<app-agree-info-component textContent="register" />
