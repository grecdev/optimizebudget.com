<div class="header">
  <h4 class="mb-sm">Create an account</h4>

  <p class="light-text">Let's get started. Fill in the details below to create your account.</p>
</div>

<form
  id="registerForm"
  class="text-align-left"
  [formGroup]="registerForm"
  (ngSubmit)="handleSubmit()"
>
  <app-form-field
    variant="outlined"
    color="primary-default"
    class="mb-default"
    fullWidth
    [labelOptions]="{
      position: 'top',
    }"
  >
    <app-input-label>Full Name</app-input-label>

    <input
      appInput
      id="full-name"
      type="text"
      placeholder="John Doe"
      [formControlName]="InputTypes.DISPLAY_NAME"
    />
  </app-form-field>

  <app-form-field
    variant="outlined"
    color="primary-default"
    class="mb-default"
    fullWidth
    [labelOptions]="{
      position: 'top',
    }"
  >
    <app-input-label>Email</app-input-label>

    <input
      appInput
      id="email"
      type="email"
      placeholder="mail@example.com"
      [formControlName]="InputTypes.EMAIL"
    />
  </app-form-field>

  <div class="password-container mb-default">
    <app-form-field
      variant="outlined"
      color="primary-default"
      fullWidth
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label class="password-label">Password</app-input-label>

      <input
        appInput
        id="password"
        type="password"
        placeholder="******"
        [formControlName]="InputTypes.PASSWORD"
      />
    </app-form-field>

    <app-password-requirement-container [password]="registerForm.value[InputTypes.PASSWORD]" />
  </div>

  <app-form-field
    class="mb-default"
    variant="outlined"
    color="primary-default"
    fullWidth
    [labelOptions]="{
      position: 'top',
    }"
  >
    <app-input-label>Confirm Password</app-input-label>

    <input
      appInput
      id="confirm-password"
      type="password"
      placeholder="******"
      [formControlName]="InputTypes.CONFIRM_PASSWORD"
    />
  </app-form-field>

  <button
    id="register-button"
    type="submit"
    appButton
    variant="contained"
    color="primary"
    [disabled]="registerForm.invalid"
    [loading]="signUpLoading"
  >
    Register
  </button>
</form>

<app-form-delimiter textContent="Or sign in with" />

<div class="buttons-socials">{{ "{{ WIP }}" }}</div>

<p>
  Already have an account?
  <a routerLink="/{{ paths.login.path }}" class="redirect-link underline">Login</a>
</p>
