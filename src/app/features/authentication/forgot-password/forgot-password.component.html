<app-authentication-logo-container title="Optimize Budget" />

<div class="form-container">
  <div class="header">
    <h4 class="mb-sm">Forgot Password</h4>

    <p class="light-text">Enter your email address to receive a password reset link.</p>
  </div>

  <form
    id="resetPasswordForm"
    class="text-align-left"
    #ngFormLogin="ngForm"
    (ngSubmit)="handleForgotPassword(ngFormLogin)"
  >
    <app-form-field
      variant="outlined"
      color="primary-default"
      class="mb-default"
      fullWidth
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>Email</app-input-label>

      <input
        appInput
        id="email"
        type="email"
        placeholder="mail@example.com"
        [(ngModel)]="resetPasswordForm[InputTypes.EMAIL]"
        [name]="InputTypes.EMAIL"
        required
      />
    </app-form-field>

    <button
      type="submit"
      id="forgot-password-button"
      appButton
      variant="contained"
      color="secondary"
      [disabled]="ngFormLogin.invalid"
      [loading]="resetPasswordLoading"
    >
      Send Reset link
    </button>
  </form>

  <p>
    Go back to
    <a routerLink="/{{ paths.login.path }}" class="redirect-link underline">Login</a>
    page
  </p>
</div>

<app-agree-info-component textContent="reset" />
