<form id="add-expense-form" [formGroup]="addExpenseForm" (ngSubmit)="handleSubmit()">
  <div class="form-inputs-container">
    <app-form-field
      variant="outlined"
      color="primary-default"
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>Expense name</app-input-label>

      <input
        appInput
        id="expense-name"
        type="text"
        name="expense-name"
        placeholder="Expense name"
        [formControlName]="ExpenseItemKey.NAME"
      />
    </app-form-field>

    <app-form-field
      variant="outlined"
      color="primary-default"
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-input-label>Vendor name</app-input-label>

      <input
        appInput
        id="vendor-name"
        type="text"
        name="vendor-name"
        placeholder="Vendor name"
        [formControlName]="ExpenseItemKey.VENDOR_NAME"
      />
    </app-form-field>

    <app-form-field
      variant="outlined"
      color="primary-default"
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-select
        id="category-select"
        label="Pick a category"
        [formControlName]="ExpenseItemKey.CATEGORY"
      >
        <app-select-option selected value="">None</app-select-option>

        <app-select-option
          *ngFor="
            let item of expenseCategories;
            index as index;
            trackBy: expenseSelectOptionTrackByFn
          "
          [value]="item.value"
        >
          {{ item.textContent }}
        </app-select-option>
      </app-select>
    </app-form-field>

    <app-form-field
      variant="outlined"
      color="primary-default"
      [labelOptions]="{
        position: 'top',
      }"
    >
      <app-select
        id="category-select"
        label="Expense status"
        [formControlName]="ExpenseItemKey.STATUS"
      >
        <app-select-option selected value="">None</app-select-option>

        <app-select-option
          *ngFor="let item of expenseStatus; index as index; trackBy: expenseSelectOptionTrackByFn"
          [value]="item.value"
          [ngSwitch]="item.value"
        >
          <app-pill-status *ngSwitchCase="ExpenseStatus.PAID" [type]="StatusType.SUCCESS">
            Paid
          </app-pill-status>

          <app-pill-status *ngSwitchCase="ExpenseStatus.PENDING" [type]="StatusType.WARNING">
            Pending
          </app-pill-status>

          <app-pill-status *ngSwitchCase="ExpenseStatus.CANCELLED" [type]="StatusType.ERROR">
            Cancelled
          </app-pill-status>

          <app-pill-status *ngSwitchDefault [type]="StatusType.DEFAULT">
            {{ item.value }}
          </app-pill-status>
        </app-select-option>
      </app-select>
    </app-form-field>
  </div>

  <app-form-field
    variant="outlined"
    color="primary-default"
    [labelOptions]="{
      position: 'top',
    }"
  >
    <app-input-label>Total</app-input-label>

    <input
      appInput
      id="expense-total"
      type="number"
      name="expense-total"
      placeholder="Total"
      min="0"
      [formControlName]="ExpenseItemKey.TOTAL"
    />
  </app-form-field>

  <div id="footer">
    <button
      type="button"
      appButton
      variant="outlined"
      color="danger"
      (click)="closeExpenseDialog($event)"
    >
      Cancel
    </button>

    <button
      type="submit"
      appButton
      variant="contained"
      color="success"
      [disabled]="addExpenseForm.invalid"
      [loading]="loading"
    >
      Add
    </button>
  </div>
</form>
